name: bites
description: Discover local food around you.
publish_to: "none"
version: 0.8.0

environment:
  sdk: ">=3.0.5 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  dots_indicator: ^4.0.1
  shared_preferences:
  geolocator:
  heroicons:
  provider:
  cached_network_image: ^3.2.3
  android_intent_plus:
  connectivity_plus:
  date_time_picker: ^2.1.0
  logger: ^2.7.0
  flutter_staggered_grid_view: ^0.7.0
  flutter_stories: ^0.3.1
  url_launcher: ^6.0.10
  flutter_map: ^8.3.0
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: "^0.14.4"
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/data/italian_cities.json
    - assets/data/restaurants.json
    - assets/data/typical_foods.json

flutter_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/logo.png"
  min_sdk_android: 21
  remove_alpha_ios: true
